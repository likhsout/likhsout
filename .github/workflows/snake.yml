# Draws the contribution "snake" used in README.md and publishes it to the `output` branch.
name: snake

on:
  schedule:
    - cron: "0 0 * * *" # every day at 00:00 UTC (6 AM in Bangladesh)
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#d6336c&color_dots=#ebedf0,#c6f6d9,#8ee8b5,#3ddc84,#1f9e5a
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff6ac1&color_dots=#161b22,#0f3d26,#1a7a46,#2bb36a,#3ddc84

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
