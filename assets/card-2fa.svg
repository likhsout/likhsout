<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <!-- Background Tech Gradient -->
    <linearGradient id="bg_2fa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow_2fa" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Ambient Corner Blur -->
    <filter id="ambient_2fa" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg_2fa)" stroke="#21262d" stroke-width="1.5"/>
  
  <!-- Ambient Accent Lighting in Top Right -->
  <circle cx="450" cy="55" r="90" fill="#38bdf8" fill-opacity="0.07" filter="url(#ambient_2fa)"/>

  <!-- Subtle Breathing Glow Border -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Category Tag with Live Indicator -->
  <g transform="translate(26, 24)">
    <rect width="165" height="24" rx="12" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.4"/>
    <circle cx="14" cy="12" r="3.5" fill="#38bdf8" filter="url(#glow_2fa)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="16" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">🛡️ SECURITY &amp; 2FA</text>
  </g>

  <!-- Top Right Animated Badge -->
  <g transform="translate(426, 24)">
    <rect width="64" height="64" rx="16" fill="#161b22" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect width="64" height="64" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" filter="url(#glow_2fa)">
      <animate attributeName="opacity" values="0.2;0.65;0.2" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Clean Security Shield Icon -->
    <path d="M 32 17 L 46 23 L 46 36 C 46 44 32 50 32 50 C 32 50 18 44 18 36 L 18 23 Z" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 32 25 L 32 40" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="32" cy="25" r="2.8" fill="#38bdf8" filter="url(#glow_2fa)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title with Crisp Typography -->
  <text x="26" y="88" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">Buffer Authenticator</text>

  <!-- Clear 2-Line Description -->
  <text x="26" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">
    <tspan x="26" dy="0">Offline, zero-knowledge 2FA code generator extension.</tspan>
    <tspan x="26" dy="22">Local client encryption powered by WebCrypto API &amp; Manifest V3.</tspan>
  </text>

  <!-- Badges -->
  <g transform="translate(26, 178)">
    <rect x="0" width="95" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="47" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Manifest V3</text>
    
    <rect x="103" width="85" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="145" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">WebCrypto</text>
    
    <rect x="196" width="95" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="243" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">TypeScript</text>
    
    <rect x="299" width="120" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="359" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Zero-Knowledge</text>
  </g>

  <!-- Bottom Divider & Action with Animated Arrow -->
  <line x1="26" y1="226" x2="494" y2="226" stroke="#21262d" stroke-width="1"/>
  <text x="26" y="248" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="11">github.com/likhsout/buffer-authenticator</text>
  
  <g transform="translate(415, 248)">
    <text x="0" y="0" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">VIEW REPO</text>
    <text x="72" y="0" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="1.8s" repeatCount="indefinite"/>
      →
    </text>
  </g>
</svg>