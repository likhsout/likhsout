<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <linearGradient id="bg_2fa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <filter id="glow_2fa" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg_2fa)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" filter="url(#glow_2fa)">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Left: Content Column -->
  <g transform="translate(24, 24)">
    <g>
      <rect width="150" height="22" rx="11" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.45"/>
      <circle cx="12" cy="11" r="3" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="82" y="15" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700">SECURITY · WEB 2FA</text>
    </g>

    <text x="0" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.4">Buffer Authenticator</text>

    <text x="0" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
      <tspan x="0" dy="0">Offline, zero-knowledge 2FA vault.</tspan>
      <tspan x="0" dy="18">Browser extension powered by WebCrypto</tspan>
      <tspan x="0" dy="18">&amp; Manifest V3 with zero tracking.</tspan>
    </text>

    <g transform="translate(0, 146)">
      <rect x="0" width="85" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="42" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">Manifest V3</text>
      
      <rect x="92" width="75" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="129" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">WebCrypto</text>

      <rect x="174" width="40" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="194" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">TS</text>
    </g>

    <g transform="translate(0, 198)">
      <text x="0" y="16" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">› github.com/likhsout/buffer-auth...</text>
      <text x="250" y="16" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
        <animateTransform attributeName="transform" type="translate" values="0,0; 3,-2; 0,0" dur="1.5s" repeatCount="indefinite"/>
        ↗
      </text>
    </g>
  </g>

  <!-- Right: Mini 2FA TOTP Vault Mockup -->
  <g transform="translate(268, 22)">
    <rect width="228" height="228" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect width="228" height="26" rx="14" fill="#161b22"/>
    <rect y="16" width="228" height="10" fill="#161b22"/>
    
    <circle cx="14" cy="13" r="3.5" fill="#ff5f56"/>
    <circle cx="24" cy="13" r="3.5" fill="#ffbd2e"/>
    <circle cx="34" cy="13" r="3.5" fill="#27c93f"/>
    <text x="126" y="16" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="9" text-anchor="middle">vault_popup.html</text>

    <g transform="translate(14, 36)">
      <!-- Active 2FA Token Card -->
      <rect width="200" height="84" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="12" y="20" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="8.5">GITHUB (likhsout)</text>
      <text x="12" y="48" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="24" font-weight="800" letter-spacing="3">849  201</text>
      
      <!-- Circular Countdown Timer with Rotating Depletion -->
      <g transform="translate(166, 38)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#1e293b" stroke-width="3"/>
        <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-dasharray="88" stroke-dashoffset="0" transform="rotate(-90)">
          <animate attributeName="stroke-dashoffset" values="0;88" dur="15s" repeatCount="indefinite"/>
        </circle>
        <text x="0" y="3.5" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700" text-anchor="middle">
          <animate attributeName="opacity" values="1;0.4;1" dur="1s" repeatCount="indefinite"/>
          ●
        </text>
      </g>
      
      <text x="12" y="70" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="8.5">● Client Encrypted (AES-256)</text>

      <!-- Token 2 -->
      <g transform="translate(0, 94)">
        <rect width="200" height="30" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="19" fill="#f8fafc" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="600">AWS: 391 042</text>
        <circle cx="180" cy="15" r="3" fill="#3ddc84"/>
      </g>

      <g transform="translate(0, 132)">
        <rect width="200" height="24" rx="6" fill="#020617" stroke="#0f172a" stroke-width="1"/>
        <text x="100" y="16" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="8" text-anchor="middle">🔒 Zero-Knowledge · Offline Only</text>
      </g>
    </g>
  </g>
</svg>