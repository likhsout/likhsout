<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <!-- Background Tech Gradient -->
    <linearGradient id="bg_b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow_b" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Ambient Corner Blur -->
    <filter id="ambient_b" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg_b)" stroke="#21262d" stroke-width="1.5"/>
  
  <!-- Ambient Accent Lighting in Top Right -->
  <circle cx="450" cy="55" r="90" fill="#c084fc" fill-opacity="0.07" filter="url(#ambient_b)"/>

  <!-- Subtle Breathing Glow Border -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Category Tag with Live Indicator -->
  <g transform="translate(26, 24)">
    <rect width="165" height="24" rx="12" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc" stroke-opacity="0.4"/>
    <circle cx="14" cy="12" r="3.5" fill="#c084fc" filter="url(#glow_b)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="16" fill="#c084fc" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">🌐 PRIVACY BROWSER</text>
  </g>

  <!-- Top Right Animated Badge -->
  <g transform="translate(426, 24)">
    <rect width="64" height="64" rx="16" fill="#161b22" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect width="64" height="64" rx="16" fill="none" stroke="#c084fc" stroke-width="1.2" opacity="0.3" filter="url(#glow_b)">
      <animate attributeName="opacity" values="0.2;0.65;0.2" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Clean Minimalist Globe/Browser Icon -->
    <circle cx="32" cy="32" r="15" fill="none" stroke="#c084fc" stroke-width="2"/>
    <ellipse cx="32" cy="32" rx="6.5" ry="15" fill="none" stroke="#c084fc" stroke-width="1.4"/>
    <line x1="17" y1="32" x2="47" y2="32" stroke="#c084fc" stroke-width="1.4"/>
    <circle cx="43" cy="21" r="2.5" fill="#c084fc" filter="url(#glow_b)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title with Crisp Typography -->
  <text x="26" y="88" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">Lightweight Browser</text>

  <!-- Clear 2-Line Description -->
  <text x="26" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">
    <tspan x="26" dy="0">Tiny, fast privacy-first Android browser with zero telemetry.</tspan>
    <tspan x="26" dy="22">Built using Kotlin &amp; Jetpack Compose Material 3 with no bloat.</tspan>
  </text>

  <!-- Badges -->
  <g transform="translate(26, 178)">
    <rect x="0" width="65" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="32" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Kotlin</text>
    
    <rect x="73" width="95" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="120" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Compose M3</text>
    
    <rect x="176" width="90" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="221" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Coroutines</text>
    
    <rect x="274" width="95" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="321" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Zero Bloat</text>
  </g>

  <!-- Bottom Divider & Action with Animated Arrow -->
  <line x1="26" y1="226" x2="494" y2="226" stroke="#21262d" stroke-width="1"/>
  <text x="26" y="248" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="11">github.com/likhsout/lightweight_browser</text>
  
  <g transform="translate(415, 248)">
    <text x="0" y="0" fill="#c084fc" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">VIEW REPO</text>
    <text x="72" y="0" fill="#c084fc" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="1.8s" repeatCount="indefinite"/>
      →
    </text>
  </g>
</svg>