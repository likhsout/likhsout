<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <linearGradient id="bg_b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <filter id="glow_b" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg_b)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.25" filter="url(#glow_b)">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Left: Content Column -->
  <g transform="translate(24, 24)">
    <g>
      <rect width="145" height="22" rx="11" fill="#c084fc" fill-opacity="0.12" stroke="#c084fc" stroke-opacity="0.45"/>
      <circle cx="12" cy="11" r="3" fill="#c084fc">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="80" y="15" fill="#c084fc" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700">KOTLIN · COMPOSE</text>
    </g>

    <text x="0" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.4">Lightweight Browser</text>

    <text x="0" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
      <tspan x="0" dy="0">Tiny, privacy-focused Android browser.</tspan>
      <tspan x="0" dy="18">Built with Kotlin &amp; Jetpack Compose M3.</tspan>
      <tspan x="0" dy="18">Zero telemetry, instant loads &amp; adblock.</tspan>
    </text>

    <g transform="translate(0, 146)">
      <rect x="0" width="60" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="30" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">Kotlin</text>
      
      <rect x="68" width="90" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="113" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">Compose M3</text>

      <rect x="166" width="68" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="200" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">Privacy</text>
    </g>

    <g transform="translate(0, 198)">
      <text x="0" y="16" fill="#c084fc" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">› github.com/likhsout/light-brow...</text>
      <text x="250" y="16" fill="#c084fc" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
        <animateTransform attributeName="transform" type="translate" values="0,0; 3,-2; 0,0" dur="1.5s" repeatCount="indefinite"/>
        ↗
      </text>
    </g>
  </g>

  <!-- Right: Mini Browser Window Mockup -->
  <g transform="translate(268, 22)">
    <rect width="228" height="228" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect width="228" height="26" rx="14" fill="#161b22"/>
    <rect y="16" width="228" height="10" fill="#161b22"/>
    
    <circle cx="14" cy="13" r="3.5" fill="#ff5f56"/>
    <circle cx="24" cy="13" r="3.5" fill="#ffbd2e"/>
    <circle cx="34" cy="13" r="3.5" fill="#27c93f"/>
    <text x="126" y="16" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="9" text-anchor="middle">LightweightBrowser.kt</text>

    <g transform="translate(14, 36)">
      <!-- URL Omnibox with Animated Page Load Progress Strip -->
      <g>
        <rect width="200" height="28" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1"/>
        <text x="10" y="18" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="9">🔒</text>
        <text x="26" y="18" fill="#f8fafc" font-family="'SF Mono', Consolas, monospace" font-size="9.5">duckduckgo.com</text>
        <rect x="155" y="6" width="36" height="16" rx="4" fill="#c084fc" fill-opacity="0.15"/>
        <text x="173" y="17" fill="#c084fc" font-family="'SF Mono', Consolas, monospace" font-size="8" text-anchor="middle">FAST</text>

        <!-- Simulated Loading Progress Line -->
        <rect x="0" y="26" width="0" height="2" fill="#c084fc">
          <animate attributeName="width" values="0;140;200;200;0" dur="3.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;1;1;0;0" dur="3.5s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Telemetry Shield Card -->
      <g transform="translate(0, 38)">
        <rect width="200" height="66" rx="8" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="18" fill="#c084fc" font-family="'SF Mono', Consolas, monospace" font-size="9" font-weight="700">🛡️ PRIVACY ENGINE ACTIVE</text>
        <circle cx="184" cy="14" r="3" fill="#3ddc84">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="12" y="34" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="9">● 0 Telemetry · 0 Cookies · 0 Ads</text>
        <text x="12" y="50" fill="#94a3b8" font-family="'SF Mono', Consolas, monospace" font-size="8.5">RAM: 18 MB · Cold Start: 42ms</text>
      </g>

      <!-- Active Page Simulation -->
      <g transform="translate(0, 114)">
        <rect width="200" height="42" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="17" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">DIU Student Routine Portal</text>
        <text x="10" y="32" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="8">Loaded 100% offline cache · HTTP/3</text>
      </g>
    </g>
  </g>
</svg>