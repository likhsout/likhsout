<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <linearGradient id="bg_bgrid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#080c12"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg_bgrid)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Tag Pill -->
  <g transform="translate(26, 26)">
    <rect width="130" height="22" rx="11" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="65" y="15" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">⚡ ANDROID BROWSER</text>
  </g>

  <!-- Phone / Browser Icon -->
  <g transform="translate(420, 26)">
    <rect width="64" height="64" rx="16" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="20" y="16" width="24" height="34" rx="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="32" cy="44" r="2" fill="#38bdf8"/>
    <path d="M 24 24 L 40 24" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Title -->
  <text x="26" y="90" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Lightweight Browser</text>

  <!-- Description -->
  <text x="26" y="122" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    <tspan x="26" dy="0">Fast, lightweight, privacy-first Android browser with Compose M3.</tspan>
    <tspan x="26" dy="20">Features multi-profile isolation, tracker blocking &amp; background play.</tspan>
  </text>

  <!-- Badges -->
  <g transform="translate(26, 185)">
    <rect width="64" height="24" rx="12" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="32" y="16" fill="#d0d7de" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Kotlin</text>

    <rect x="72" width="125" height="24" rx="12" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="134" y="16" fill="#d0d7de" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Jetpack Compose</text>

    <rect x="205" width="105" height="24" rx="12" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="257" y="16" fill="#d0d7de" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Multi-Profile</text>

    <rect x="318" width="85" height="24" rx="12" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="360" y="16" fill="#d0d7de" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Room DB</text>
  </g>

  <!-- Bottom Divider & Action -->
  <line x1="26" y1="228" x2="494" y2="228" stroke="#21262d" stroke-width="1"/>
  <text x="26" y="248" fill="#7d8590" font-family="'SF Mono', Consolas, monospace" font-size="11">github.com/Likhon545466/lightweight_browser</text>
  <text x="494" y="248" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="end">VIEW APK →</text>
</svg>