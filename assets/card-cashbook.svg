<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <linearGradient id="bg_c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="emeraldWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3ddc84"/>
    </linearGradient>
    <filter id="glow_c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg_c)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#3ddc84" stroke-width="1.5" opacity="0.25" filter="url(#glow_c)">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Left: Content Column -->
  <g transform="translate(24, 24)">
    <g>
      <rect width="145" height="22" rx="11" fill="#3ddc84" fill-opacity="0.12" stroke="#3ddc84" stroke-opacity="0.45"/>
      <circle cx="12" cy="11" r="3" fill="#3ddc84">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="80" y="15" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700">FINANCE · LEDGER</text>
    </g>

    <text x="0" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.4">CashBook</text>

    <text x="0" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
      <tspan x="0" dy="0">Offline-first personal finance app.</tspan>
      <tspan x="0" dy="18">Zero-telemetry ledger with local SQLite,</tspan>
      <tspan x="0" dy="18">instant reports &amp; debt management.</tspan>
    </text>

    <g transform="translate(0, 146)">
      <rect x="0" width="65" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="32" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">Flutter</text>
      
      <rect x="72" width="65" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="104" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">SQLite</text>

      <rect x="144" width="75" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="181" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">Clean Arch</text>
    </g>

    <g transform="translate(0, 198)">
      <text x="0" y="16" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">› github.com/likhsout/cashbook</text>
      <text x="220" y="16" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
        <animateTransform attributeName="transform" type="translate" values="0,0; 3,-2; 0,0" dur="1.5s" repeatCount="indefinite"/>
        ↗
      </text>
    </g>
  </g>

  <!-- Right: Mini Finance Dashboard Mockup -->
  <g transform="translate(268, 22)">
    <rect width="228" height="228" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect width="228" height="26" rx="14" fill="#161b22"/>
    <rect y="16" width="228" height="10" fill="#161b22"/>
    
    <circle cx="14" cy="13" r="3.5" fill="#ff5f56"/>
    <circle cx="24" cy="13" r="3.5" fill="#ffbd2e"/>
    <circle cx="34" cy="13" r="3.5" fill="#27c93f"/>
    <text x="126" y="16" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="9" text-anchor="middle">cashbook_wallet.dart</text>

    <g transform="translate(14, 36)">
      <!-- Balance Card -->
      <rect width="200" height="78" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="12" y="19" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="8.5">TOTAL NET BALANCE</text>
      <rect x="135" y="8" width="55" height="16" rx="8" fill="#3ddc84" fill-opacity="0.15"/>
      <text x="162" y="19" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="8" font-weight="700" text-anchor="middle">▲ +18.4%</text>

      <text x="12" y="42" fill="#3ddc84" font-family="system-ui, sans-serif" font-size="21" font-weight="800">৳ 42,850.00</text>
      
      <!-- Mini Sparkline Wave with Pulse Point -->
      <path d="M 12 62 Q 45 44, 75 52 T 130 40 T 188 32" fill="none" stroke="url(#emeraldWave)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="188" cy="32" r="3.5" fill="#3ddc84" filter="url(#glow_c)"/>
      <circle cx="188" cy="32" r="3.5" fill="none" stroke="#3ddc84" stroke-width="1.5">
        <animate attributeName="r" values="3.5;8;3.5" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="2s" repeatCount="indefinite"/>
      </circle>

      <!-- Recent Transactions -->
      <g transform="translate(0, 88)">
        <rect width="200" height="28" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="14" r="3" fill="#3ddc84"/>
        <text x="24" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Freelance Project</text>
        <text x="190" y="18" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" text-anchor="end">+৳16,500</text>
      </g>

      <g transform="translate(0, 122)">
        <rect width="200" height="28" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="14" r="3" fill="#ef4444"/>
        <text x="24" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">DIU Semester Fee</text>
        <text x="190" y="18" fill="#ef4444" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" text-anchor="end">-৳8,400</text>
      </g>

      <g transform="translate(0, 156)">
        <text x="100" y="14" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="8" text-anchor="middle">● Local SQLite · Zero Telemetry</text>
      </g>
    </g>
  </g>
</svg>