      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="598" height="378" rx="16" fill="url(#cbg_dium)" stroke="#30363d" stroke-width="1.5"/>

