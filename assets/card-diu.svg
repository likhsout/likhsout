<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 312" width="1000" height="312">
  <defs>
    <linearGradient id="cbg_diu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="scheduleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glowCard" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer Frame with Subtle Breathing Neon Glow -->
  <rect x="1" y="1" width="998" height="310" rx="16" fill="url(#cbg_diu)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="998" height="310" rx="16" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity="0.2" filter="url(#glowCard)">
    <animate attributeName="opacity" values="0.15;0.45;0.2;0.5;0.15" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Left Content Area -->
  <g transform="translate(36, 36)">
    <!-- Category Tag with Live Pulsing Indicator -->
    <g>
      <rect width="240" height="24" rx="12" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5"/>
      <circle cx="14" cy="12" r="3.5" fill="#3ddc84" filter="url(#glowCard)">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="130" y="16" fill="#c4b5fd" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">★ FLAGSHIP · ENGINE ACTIVE</text>
    </g>

    <!-- Title -->
    <text x="0" y="65" fill="#f0f6fc" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800">DIU Campus Schedule Parser</text>

    <!-- Subtitle / Description -->
    <text x="0" y="98" fill="#8b949e" font-family="system-ui, -apple-system, sans-serif" font-size="14">
      <tspan x="0" dy="0">Smart multi-sheet Excel-to-JSON class schedule parser for Daffodil International University.</tspan>
      <tspan x="0" dy="22">Auto-structures complex semester grids, time intervals, batches, sections, and faculty codes.</tspan>
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 160)">
      <rect width="78" height="26" rx="13" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/>
      <text x="39" y="17" fill="#d0d7de" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Python 3</text>

      <rect x="86" width="75" height="26" rx="13" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/>
      <text x="123" y="17" fill="#d0d7de" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">pandas</text>

      <rect x="169" width="85" height="26" rx="13" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/>
      <text x="211" y="17" fill="#d0d7de" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">openpyxl</text>

      <rect x="262" width="105" height="26" rx="13" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/>
      <text x="314" y="17" fill="#d0d7de" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">JSON Generator</text>

      <rect x="375" width="125" height="26" rx="13" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/>
      <text x="437" y="17" fill="#d0d7de" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Granular Filtering</text>

      <rect x="508" width="105" height="26" rx="13" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.4"/>
      <text x="560" y="17" fill="#d0d7de" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Multi-Sheet</text>
    </g>

    <!-- Metrics Bar with Glowing Text -->
    <g transform="translate(0, 222)" font-family="'SF Mono', Consolas, monospace">
      <text x="0" y="0" fill="#7d8590" font-size="11">PARSING SPEED</text>
      <text x="0" y="24" fill="#a78bfa" font-size="18" font-weight="700">&lt; 0.2s</text>

      <text x="130" y="0" fill="#7d8590" font-size="11">ACCURACY</text>
      <text x="130" y="24" fill="#3ddc84" font-size="18" font-weight="700">100% Lossless</text>

      <text x="260" y="0" fill="#7d8590" font-size="11">SUPPORT</text>
      <text x="260" y="24" fill="#38bdf8" font-size="18" font-weight="700">Day / Eve / Ramadan</text>
    </g>
  </g>

  <!-- Divider -->
  <rect x="675" y="30" width="1" height="252" fill="#30363d"/>

  <!-- Right: Schedule Matrix / Parser Illustration with Live Data Flow -->
  <g transform="translate(705, 25)">
    <rect width="265" height="260" rx="16" fill="url(#scheduleGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window top -->
    <rect width="265" height="28" rx="16" fill="#1e293b"/>
    <rect y="16" width="265" height="12" fill="#1e293b"/>
    <circle cx="16" cy="14" r="4.5" fill="#ff5f56"/>
    <circle cx="30" cy="14" r="4.5" fill="#ffbd2e"/>
    <circle cx="44" cy="14" r="4.5" fill="#27c93f"/>
    <text x="140" y="18" fill="#94a3b8" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">routine_pipeline.py</text>

    <!-- Matrix Rows Simulation -->
    <g transform="translate(14, 42)" font-family="'SF Mono', Consolas, monospace" font-size="10">
      <!-- Input Box -->
      <rect width="237" height="42" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#818cf8" font-weight="600">INPUT: workbook.xlsx</text>
      <text x="12" y="32" fill="#64748b">Batch 44 · Sec D · SE113</text>
      
      <!-- Arrow 1 with Flowing Data Packet Animation -->
      <path d="M 118 48 L 118 64 L 114 60 M 118 64 L 122 60" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
      <circle cx="118" cy="48" r="2.5" fill="#38bdf8" filter="url(#glowCard)">
        <animate attributeName="cy" values="48;64;48" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <!-- Engine Node with Electric Glow Border -->
      <g transform="translate(0, 68)">
        <rect width="237" height="46" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
        <rect width="237" height="46" rx="8" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.5" filter="url(#glowCard)">
          <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2s" repeatCount="indefinite"/>
        </rect>
        <text x="12" y="18" fill="#c4b5fd" font-weight="600">⚡ Smart Cleaning Engine</text>
        <text x="12" y="34" fill="#3ddc84">Regex time fix · multi-grid parse</text>
      </g>

      <!-- Arrow 2 with Flowing Output Packet Animation -->
      <path d="M 118 120 L 118 136 L 114 132 M 118 136 L 122 132" stroke="#3ddc84" stroke-width="2" stroke-linecap="round"/>
      <circle cx="118" cy="120" r="2.5" fill="#3ddc84" filter="url(#glowCard)">
        <animate attributeName="cy" values="120;136;120" dur="1.8s" repeatCount="indefinite"/>
      </circle>

      <!-- Output JSON Box with Glowing Green Border -->
      <g transform="translate(0, 140)">
        <rect width="237" height="58" rx="8" fill="#020617" stroke="#10b981" stroke-width="1.2"/>
        <rect width="237" height="58" rx="8" fill="none" stroke="#3ddc84" stroke-width="1.2" opacity="0.4" filter="url(#glowCard)">
          <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.5s" repeatCount="indefinite"/>
        </rect>
        <text x="12" y="18" fill="#34d399" font-weight="600">OUTPUT: routine.json</text>
        <text x="12" y="34" fill="#94a3b8">{ "batch": 44, "room": "KT-502" }</text>
        <text x="12" y="48" fill="#64748b">{ "time": "08:30-10:00", ... }</text>
      </g>
    </g>
  </g>
</svg>