<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <!-- Background Tech Gradient -->
    <linearGradient id="bg_r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow_r" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Ambient Corner Blur -->
    <filter id="ambient_r" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg_r)" stroke="#21262d" stroke-width="1.5"/>
  
  <!-- Ambient Accent Lighting in Top Right -->
  <circle cx="450" cy="55" r="90" fill="#fbbf24" fill-opacity="0.07" filter="url(#ambient_r)"/>

  <!-- Subtle Breathing Glow Border -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Category Tag with Live Indicator -->
  <g transform="translate(26, 24)">
    <rect width="170" height="24" rx="12" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.4"/>
    <circle cx="14" cy="12" r="3.5" fill="#fbbf24" filter="url(#glow_r)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="93" y="16" fill="#fbbf24" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">📦 ERP &amp; WAREHOUSE</text>
  </g>

  <!-- Top Right Animated Badge -->
  <g transform="translate(426, 24)">
    <rect width="64" height="64" rx="16" fill="#161b22" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect width="64" height="64" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.2" opacity="0.3" filter="url(#glow_r)">
      <animate attributeName="opacity" values="0.2;0.65;0.2" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Clean Warehouse Isometric Box Icon -->
    <path d="M 32 17 L 47 25 L 47 42 L 32 50 L 17 42 L 17 25 Z" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M 32 17 L 32 50 M 17 25 L 32 33.5 L 47 25" stroke="#fbbf24" stroke-width="1.4"/>
    <circle cx="32" cy="33.5" r="2.8" fill="#fbbf24" filter="url(#glow_r)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title with Crisp Typography -->
  <text x="26" y="88" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">RetailSync</text>

  <!-- Clear 2-Line Description -->
  <text x="26" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">
    <tspan x="26" dy="0">Centralized super shop warehouse management system.</tspan>
    <tspan x="26" dy="22">High-velocity stock transfers, barcode tracking &amp; cashier POS.</tspan>
  </text>

  <!-- Badges -->
  <g transform="translate(26, 178)">
    <rect x="0" width="65" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="32" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">React</text>
    
    <rect x="73" width="90" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="118" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">TypeScript</text>
    
    <rect x="171" width="80" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="211" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Tailwind</text>
    
    <rect x="259" width="85" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="301" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">REST API</text>
  </g>

  <!-- Bottom Divider & Action with Animated Arrow -->
  <line x1="26" y1="226" x2="494" y2="226" stroke="#21262d" stroke-width="1"/>
  <text x="26" y="248" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="11">github.com/likhsout/retailsync</text>
  
  <g transform="translate(415, 248)">
    <text x="0" y="0" fill="#fbbf24" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">VIEW REPO</text>
    <text x="72" y="0" fill="#fbbf24" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="1.8s" repeatCount="indefinite"/>
      →
    </text>
  </g>
</svg>