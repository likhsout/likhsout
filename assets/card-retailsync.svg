<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <!-- Background Tech Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="50%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Shimmer Light Sweep -->
    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;150%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;250%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer Card Frame with Breathing Glow Border -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.2" filter="url(#glow)">
    <animate attributeName="opacity" values="0.15;0.5;0.2;0.55;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Specular Shimmer Reflection Layer -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#shimmer)"/>

  <!-- Top Category Tag with Live Indicator -->
  <g transform="translate(26, 24)">
    <rect width="170" height="24" rx="12" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.4"/>
    <circle cx="14" cy="12" r="3.5" fill="#fbbf24" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="93" y="16" fill="#fbbf24" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">📦 ERP &amp; WAREHOUSE</text>
  </g>

  <!-- Top Right Animated Badge -->
  <g transform="translate(424, 24)">
    <rect width="68" height="68" rx="16" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-width="1.2"/>
    <rect width="68" height="68" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.3" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    
    <path d="M 34 18 L 50 26 L 50 44 L 34 52 L 18 44 L 18 26 Z" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M 34 18 L 34 52 M 18 26 L 34 35 L 50 26" stroke="#fbbf24" stroke-width="1.5"/>
    <circle cx="34" cy="35" r="3" fill="#fbbf24" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title with Electric Typography -->
  <text x="26" y="88" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="0.5">RetailSync</text>

  <!-- Description -->
  <text x="26" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">
    <tspan x="26" dy="0">Centralized super shop warehouse management system.</tspan>
    <tspan x="26" dy="20">High-velocity stock transfers, barcode tracking &amp; cashier POS.</tspan>
  </text>

  <!-- Badges -->
  <g transform="translate(26, 178)">
    
    <rect x="0" width="65" height="26" rx="13" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.3"/>
    <text x="32" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">React</text>
    <rect x="73" width="90" height="26" rx="13" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.3"/>
    <text x="118" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">TypeScript</text>
    <rect x="171" width="80" height="26" rx="13" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.3"/>
    <text x="211" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Tailwind</text>
    <rect x="259" width="85" height="26" rx="13" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.3"/>
    <text x="301" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">REST API</text>
  </g>

  <!-- Bottom Divider & Action with Animated Arrow -->
  <line x1="26" y1="226" x2="494" y2="226" stroke="#1e293b" stroke-width="1"/>
  <text x="26" y="248" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="11">github.com/likhsout/retailsync</text>
  
  <g transform="translate(415, 248)">
    <text x="0" y="0" fill="#fbbf24" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">VIEW REPO</text>
    <text x="72" y="0" fill="#fbbf24" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="1.8s" repeatCount="indefinite"/>
      →
    </text>
  </g>
</svg>