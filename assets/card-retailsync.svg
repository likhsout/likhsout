<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <linearGradient id="bg_r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <filter id="glow_r" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg_r)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.25" filter="url(#glow_r)">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Left: Content Column -->
  <g transform="translate(24, 24)">
    <g>
      <rect width="150" height="22" rx="11" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.45"/>
      <circle cx="12" cy="11" r="3" fill="#fbbf24">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="82" y="15" fill="#fbbf24" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700">WAREHOUSE · ERP</text>
    </g>

    <text x="0" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.4">RetailSync</text>

    <text x="0" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
      <tspan x="0" dy="0">Centralized super shop ERP system.</tspan>
      <tspan x="0" dy="18">Multi-outlet inventory synchronization,</tspan>
      <tspan x="0" dy="18">barcode tracking &amp; live sales metrics.</tspan>
    </text>

    <g transform="translate(0, 146)">
      <rect x="0" width="70" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="35" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">Node.js</text>
      
      <rect x="78" width="80" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="118" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">PostgreSQL</text>

      <rect x="166" width="60" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="196" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">ERP</text>
    </g>

    <g transform="translate(0, 198)">
      <text x="0" y="16" fill="#fbbf24" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">› github.com/likhsout/retailsync</text>
      <text x="225" y="16" fill="#fbbf24" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
        <animateTransform attributeName="transform" type="translate" values="0,0; 3,-2; 0,0" dur="1.5s" repeatCount="indefinite"/>
        ↗
      </text>
    </g>
  </g>

  <!-- Right: Mini Inventory Terminal Mockup -->
  <g transform="translate(268, 22)">
    <rect width="228" height="228" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect width="228" height="26" rx="14" fill="#161b22"/>
    <rect y="16" width="228" height="10" fill="#161b22"/>
    
    <circle cx="14" cy="13" r="3.5" fill="#ff5f56"/>
    <circle cx="24" cy="13" r="3.5" fill="#ffbd2e"/>
    <circle cx="34" cy="13" r="3.5" fill="#27c93f"/>
    <text x="126" y="16" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="9" text-anchor="middle">inventory_terminal.ts</text>

    <g transform="translate(14, 36)">
      <!-- Barcode / SKU Scan Box -->
      <rect width="200" height="76" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <text x="12" y="18" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="8.5">SKU #RS-9042 · SUPER-SHOP</text>
      
      <!-- Simulated Barcode Lines -->
      <g transform="translate(12, 26)">
        <rect x="0" width="3" height="24" fill="#e2e8f0"/>
        <rect x="6" width="2" height="24" fill="#e2e8f0"/>
        <rect x="11" width="5" height="24" fill="#e2e8f0"/>
        <rect x="19" width="2" height="24" fill="#e2e8f0"/>
        <rect x="24" width="4" height="24" fill="#e2e8f0"/>
        <rect x="31" width="1" height="24" fill="#e2e8f0"/>
        <rect x="35" width="4" height="24" fill="#e2e8f0"/>
        <rect x="42" width="2" height="24" fill="#e2e8f0"/>
        <rect x="47" width="5" height="24" fill="#e2e8f0"/>
        <rect x="55" width="2" height="24" fill="#e2e8f0"/>
        <rect x="60" width="3" height="24" fill="#e2e8f0"/>
        <rect x="66" width="4" height="24" fill="#e2e8f0"/>
        
        <!-- Animated Red Laser Scanner Line -->
        <line x1="0" y1="12" x2="70" y2="12" stroke="#ef4444" stroke-width="2">
          <animate attributeName="y1" values="2;22;2" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="2;22;2" dur="1.8s" repeatCount="indefinite"/>
        </line>
      </g>
      
      <text x="92" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Inventory Status</text>
      <text x="92" y="52" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700">1,420 Qty [IN STOCK]</text>

      <!-- Multi Outlet Sync -->
      <g transform="translate(0, 86)">
        <rect width="200" height="30" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="19" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Dhanmondi Hub</text>
        <text x="190" y="19" fill="#fbbf24" font-family="'SF Mono', Consolas, monospace" font-size="9" text-anchor="end">SYNCED</text>
      </g>

      <g transform="translate(0, 122)">
        <rect width="200" height="30" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
        <circle cx="14" cy="15" r="3" fill="#3ddc84">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="24" y="19" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Uttara Warehouse</text>
        <text x="190" y="19" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="9" text-anchor="end">ONLINE</text>
      </g>
    </g>
  </g>
</svg>