<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <linearGradient id="bg_rm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <filter id="glow_rm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg_rm)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.25" filter="url(#glow_rm)">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Left: Content Column -->
  <g transform="translate(24, 24)">
    <g>
      <rect width="145" height="22" rx="11" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.45"/>
      <circle cx="12" cy="11" r="3" fill="#f43f5e">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="80" y="15" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700">ANDROID · MODDING</text>
    </g>

    <text x="0" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.4">Android Modding Lab</text>

    <text x="0" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
      <tspan x="0" dy="0">Custom ReVanced patches &amp; tweaks.</tspan>
      <tspan x="0" dy="18">Bytecode hooks, smali enhancements</tspan>
      <tspan x="0" dy="18">&amp; telemetry-free system builds.</tspan>
    </text>

    <g transform="translate(0, 146)">
      <rect x="0" width="55" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="27" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">Smali</text>
      
      <rect x="63" width="70" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="98" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">Bytecode</text>

      <rect x="141" width="75" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="178" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">ReVanced</text>
    </g>

    <g transform="translate(0, 198)">
      <text x="0" y="16" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">› github.com/likhsout/revanced-p...</text>
      <text x="250" y="16" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
        <animateTransform attributeName="transform" type="translate" values="0,0; 3,-2; 0,0" dur="1.5s" repeatCount="indefinite"/>
        ↗
      </text>
    </g>
  </g>

  <!-- Right: Mini Patcher Terminal Mockup -->
  <g transform="translate(268, 22)">
    <rect width="228" height="228" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect width="228" height="26" rx="14" fill="#161b22"/>
    <rect y="16" width="228" height="10" fill="#161b22"/>
    
    <circle cx="14" cy="13" r="3.5" fill="#ff5f56"/>
    <circle cx="24" cy="13" r="3.5" fill="#ffbd2e"/>
    <circle cx="34" cy="13" r="3.5" fill="#27c93f"/>
    <text x="126" y="16" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="9" text-anchor="middle">patcher.sh · CLI</text>

    <g transform="translate(14, 36)" font-family="'SF Mono', Consolas, monospace" font-size="9">
      <rect width="200" height="156" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      
      <text x="10" y="20" fill="#3ddc84">$</text>
      <text x="22" y="20" fill="#f8fafc">revanced-cli patch</text>
      
      <text x="10" y="38" fill="#a78bfa">&gt; target: app.apk</text>
      <text x="10" y="54" fill="#38bdf8">&gt; parsing smali AST...</text>
      
      <text x="10" y="74" fill="#3ddc84">+ hook: custom_theme</text>
      <text x="10" y="90" fill="#3ddc84">+ remove: analytics.dex</text>
      <text x="10" y="106" fill="#fbbf24">+ patch: ad_filter.smali</text>
      
      <text x="10" y="132" fill="#3ddc84" font-weight="700">[ OK ]</text>
      <text x="45" y="132" fill="#e2e8f0">app-patched.apk</text>
      <!-- Blinking Terminal Block Cursor -->
      <rect x="156" y="123" width="7" height="11" fill="#3ddc84">
        <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>