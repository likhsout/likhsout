<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <!-- Background Tech Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="50%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Shimmer Light Sweep -->
    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f43f5e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;150%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;250%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer Card Frame with Breathing Glow Border -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.2" filter="url(#glow)">
    <animate attributeName="opacity" values="0.15;0.5;0.2;0.55;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Specular Shimmer Reflection Layer -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#shimmer)"/>

  <!-- Top Category Tag with Live Indicator -->
  <g transform="translate(26, 24)">
    <rect width="165" height="24" rx="12" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.4"/>
    <circle cx="14" cy="12" r="3.5" fill="#f43f5e" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="90" y="16" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">⚡ SYSTEM &amp; TWEAKS</text>
  </g>

  <!-- Top Right Animated Badge -->
  <g transform="translate(424, 24)">
    <rect width="68" height="68" rx="16" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-width="1.2"/>
    <rect width="68" height="68" rx="16" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.3" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    
    <rect x="23" y="23" width="22" height="22" rx="4" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="34" cy="34" r="4" fill="#f43f5e">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <line x1="34" y1="17" x2="34" y2="23" stroke="#f43f5e" stroke-width="1.5"/>
    <line x1="34" y1="45" x2="34" y2="51" stroke="#f43f5e" stroke-width="1.5"/>
    <line x1="17" y1="34" x2="23" y2="34" stroke="#f43f5e" stroke-width="1.5"/>
    <line x1="45" y1="34" x2="51" y2="34" stroke="#f43f5e" stroke-width="1.5"/>
  </g>

  <!-- Title with Electric Typography -->
  <text x="26" y="88" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="0.5">Android Modding Lab</text>

  <!-- Description -->
  <text x="26" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">
    <tspan x="26" dy="0">Custom ReVanced patches, bytecode modifications &amp; tweaks.</tspan>
    <tspan x="26" dy="20">Precision Android enhancements, UI hooks &amp; privacy patches.</tspan>
  </text>

  <!-- Badges -->
  <g transform="translate(26, 178)">
    
    <rect x="0" width="60" height="26" rx="13" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-opacity="0.3"/>
    <text x="30" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Smali</text>
    <rect x="68" width="55" height="26" rx="13" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-opacity="0.3"/>
    <text x="95" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Java</text>
    <rect x="131" width="80" height="26" rx="13" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-opacity="0.3"/>
    <text x="171" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Bytecode</text>
    <rect x="219" width="90" height="26" rx="13" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-opacity="0.3"/>
    <text x="264" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">ReVanced</text>
  </g>

  <!-- Bottom Divider & Action with Animated Arrow -->
  <line x1="26" y1="226" x2="494" y2="226" stroke="#1e293b" stroke-width="1"/>
  <text x="26" y="248" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="11">github.com/Likhon545466/revanced-patches</text>
  
  <g transform="translate(415, 248)">
    <text x="0" y="0" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">VIEW REPO</text>
    <text x="72" y="0" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="1.8s" repeatCount="indefinite"/>
      →
    </text>
  </g>
</svg>