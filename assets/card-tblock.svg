<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <!-- Background Tech Gradient -->
    <linearGradient id="bg_tb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow_tb" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Ambient Corner Blur -->
    <filter id="ambient_tb" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg_tb)" stroke="#21262d" stroke-width="1.5"/>
  
  <!-- Ambient Accent Lighting in Top Right -->
  <circle cx="450" cy="55" r="90" fill="#f43f5e" fill-opacity="0.07" filter="url(#ambient_tb)"/>

  <!-- Subtle Breathing Glow Border -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#f43f5e" stroke-width="1.2" opacity="0.25">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Category Tag with Live Indicator -->
  <g transform="translate(26, 24)">
    <rect width="185" height="24" rx="12" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.4"/>
    <circle cx="14" cy="12" r="3.5" fill="#f43f5e" filter="url(#glow_tb)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="102" y="16" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">🛡️ AD BLOCKER &amp; PRIVACY</text>
  </g>

  <!-- Top Right Animated Badge -->
  <g transform="translate(426, 24)">
    <rect width="64" height="64" rx="16" fill="#161b22" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect width="64" height="64" rx="16" fill="none" stroke="#f43f5e" stroke-width="1.2" opacity="0.3" filter="url(#glow_tb)">
      <animate attributeName="opacity" values="0.2;0.65;0.2" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Clean Ad Blocker Shield Icon -->
    <path d="M 32 17 L 47 23 C 47 37 39 46 32 50 C 25 46 17 37 17 23 Z" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="32" cy="33.5" r="7.5" fill="none" stroke="#f43f5e" stroke-width="1.8"/>
    <line x1="27" y1="28.5" x2="37" y2="38.5" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="47" cy="20" r="2.8" fill="#f43f5e" filter="url(#glow_tb)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title with Crisp Typography -->
  <text x="26" y="88" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.3">T-Block Origin</text>

  <!-- Clear 2-Line Description -->
  <text x="26" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">
    <tspan x="26" dy="0">Fast, privacy-first and native Manifest V3 content blocker.</tspan>
    <tspan x="26" dy="22">Dynamic rule compilation, zero telemetry &amp; Material Design 3.</tspan>
  </text>

  <!-- Badges -->
  <g transform="translate(26, 178)">
    <rect x="0" width="105" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="52" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Manifest V3</text>
    
    <rect x="113" width="90" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="158" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">JavaScript</text>
    
    <rect x="211" width="85" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="253" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Material 3</text>
    
    <rect x="304" width="75" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="341" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">GPL-3.0</text>
  </g>

  <!-- Bottom Divider & Action with Animated Arrow -->
  <line x1="26" y1="226" x2="494" y2="226" stroke="#21262d" stroke-width="1"/>
  <text x="26" y="248" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="11">github.com/likhsout/T-Block-Origin</text>
  
  <g transform="translate(415, 248)">
    <text x="0" y="0" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">VIEW REPO</text>
    <text x="72" y="0" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="1.8s" repeatCount="indefinite"/>
      →
    </text>
  </g>
</svg>
