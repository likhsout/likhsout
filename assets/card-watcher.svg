<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <linearGradient id="bg_w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="50%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>
    <linearGradient id="pinkGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6ac1"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow_w" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer Card Frame with Breathing Glow Border -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg_w)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#ff6ac1" stroke-width="1.5" opacity="0.25" filter="url(#glow_w)">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Left: Content Column -->
  <g transform="translate(24, 24)">
    <g>
      <rect width="148" height="22" rx="11" fill="#ff6ac1" fill-opacity="0.12" stroke="#ff6ac1" stroke-opacity="0.45"/>
      <circle cx="12" cy="11" r="3" fill="#ff6ac1">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="82" y="15" fill="#ff6ac1" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700">FLUTTER · TRACKER</text>
    </g>

    <text x="0" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800" letter-spacing="-0.4">Watcher</text>

    <text x="0" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
      <tspan x="0" dy="0">Smart movie &amp; series tracker app.</tspan>
      <tspan x="0" dy="18">Track seasons, watchlist, ratings</tspan>
      <tspan x="0" dy="18">&amp; cloud backup with clean UI.</tspan>
    </text>

    <g transform="translate(0, 146)">
      <rect x="0" width="65" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="32" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">Flutter</text>
      
      <rect x="72" width="55" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="99" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">SQLite</text>

      <rect x="134" width="70" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="169" y="15" fill="#cbd5e1" font-family="'SF Mono', Consolas, monospace" font-size="10" text-anchor="middle">REST API</text>
    </g>

    <g transform="translate(0, 198)">
      <text x="0" y="16" fill="#ff6ac1" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">› github.com/likhsout/watcher</text>
      <text x="206" y="16" fill="#ff6ac1" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
        <animateTransform attributeName="transform" type="translate" values="0,0; 3,-2; 0,0" dur="1.5s" repeatCount="indefinite"/>
        ↗
      </text>
    </g>
  </g>

  <!-- Right: Mini Streaming Player UI Mockup -->
  <g transform="translate(268, 22)">
    <rect width="228" height="228" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
    <rect width="228" height="26" rx="14" fill="#161b22"/>
    <rect y="16" width="228" height="10" fill="#161b22"/>
    
    <circle cx="14" cy="13" r="3.5" fill="#ff5f56"/>
    <circle cx="24" cy="13" r="3.5" fill="#ffbd2e"/>
    <circle cx="34" cy="13" r="3.5" fill="#27c93f"/>
    <text x="126" y="16" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="9" text-anchor="middle">watcher_player.dart</text>

    <g transform="translate(14, 36)">
      <!-- Main Playing Card -->
      <rect width="200" height="82" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      
      <!-- Video Poster / Play Button with Glow -->
      <rect x="10" y="10" width="38" height="38" rx="6" fill="#ff6ac1" fill-opacity="0.15" stroke="#ff6ac1" stroke-width="1"/>
      <polygon points="25,23 35,29 25,35" fill="#ff6ac1">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite"/>
      </polygon>

      <text x="56" y="22" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Interstellar (2014)</text>
      <text x="56" y="36" fill="#fbbf24" font-family="'SF Mono', Consolas, monospace" font-size="9">★ 8.7 · Sci-Fi · 4K HDR</text>

      <!-- Live Soundwave Equalizer -->
      <g transform="translate(170, 14)">
        <rect x="0" y="6" width="2.5" height="10" rx="1" fill="#ff6ac1">
          <animate attributeName="height" values="4;13;3;10;4" dur="1.1s" repeatCount="indefinite"/>
          <animate attributeName="y" values="12;3;13;6;12" dur="1.1s" repeatCount="indefinite"/>
        </rect>
        <rect x="5" y="3" width="2.5" height="13" rx="1" fill="#ff6ac1">
          <animate attributeName="height" values="12;3;14;6;12" dur="0.9s" repeatCount="indefinite"/>
          <animate attributeName="y" values="4;13;2;10;4" dur="0.9s" repeatCount="indefinite"/>
        </rect>
        <rect x="10" y="7" width="2.5" height="9" rx="1" fill="#ff6ac1">
          <animate attributeName="height" values="3;14;6;11;3" dur="1.3s" repeatCount="indefinite"/>
          <animate attributeName="y" values="13;2;10;5;13" dur="1.3s" repeatCount="indefinite"/>
        </rect>
        <rect x="15" y="5" width="2.5" height="11" rx="1" fill="#ff6ac1">
          <animate attributeName="height" values="10;4;13;3;10" dur="1.0s" repeatCount="indefinite"/>
          <animate attributeName="y" values="6;12;3;13;6" dur="1.0s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Streaming Progress Bar with Dynamic Playhead -->
      <rect x="10" y="56" width="180" height="5" rx="2.5" fill="#1e293b"/>
      <rect x="10" y="56" width="130" height="5" rx="2.5" fill="url(#pinkGlow)">
        <animate attributeName="width" values="115;145;115" dur="3.5s" repeatCount="indefinite"/>
      </rect>
      <circle cx="140" cy="58.5" r="4.5" fill="#ffffff" filter="url(#glow_w)">
        <animate attributeName="cx" values="125;155;125" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <text x="10" y="72" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="8">01:48:22 / 02:49:00</text>
      <text x="190" y="72" fill="#ff6ac1" font-family="'SF Mono', Consolas, monospace" font-size="8" text-anchor="end">72%</text>

      <!-- Playlist Queue Rows -->
      <g transform="translate(0, 92)">
        <rect width="200" height="28" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Oppenheimer</text>
        <rect x="135" y="6" width="55" height="16" rx="8" fill="#ff6ac1" fill-opacity="0.15"/>
        <text x="162" y="17" fill="#ff6ac1" font-family="'SF Mono', Consolas, monospace" font-size="8" text-anchor="middle">WATCHED</text>
      </g>

      <g transform="translate(0, 126)">
        <rect width="200" height="28" rx="6" fill="#0b0f19" stroke="#1e293b" stroke-width="1"/>
        <text x="10" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Severance S2</text>
        <rect x="135" y="6" width="55" height="16" rx="8" fill="#3ddc84" fill-opacity="0.15"/>
        <circle cx="143" cy="14" r="2.5" fill="#3ddc84">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <text x="166" y="17" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="8" text-anchor="middle">STREAM</text>
      </g>
    </g>
  </g>
</svg>