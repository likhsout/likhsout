<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 272" width="520" height="272">
  <defs>
    <!-- Background Tech Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="50%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>

    <!-- Shimmer Light Sweep -->
    <linearGradient id="shimmer" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff6ac1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;150%" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;250%" dur="4.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer Card Frame with Breathing Glow Border -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="518" height="270" rx="16" fill="none" stroke="#ff6ac1" stroke-width="1.5" opacity="0.2" filter="url(#glow)">
    <animate attributeName="opacity" values="0.15;0.5;0.2;0.55;0.15" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Specular Shimmer Reflection Layer -->
  <rect x="1" y="1" width="518" height="270" rx="16" fill="url(#shimmer)"/>

  <!-- Top Category Tag with Live Indicator -->
  <g transform="translate(26, 24)">
    <rect width="155" height="24" rx="12" fill="#ff6ac1" fill-opacity="0.12" stroke="#ff6ac1" stroke-opacity="0.4"/>
    <circle cx="14" cy="12" r="3.5" fill="#ff6ac1" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="85" y="16" fill="#ff6ac1" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">🎬 MEDIA TRACKER</text>
  </g>

  <!-- Top Right Animated Badge -->
  <g transform="translate(424, 24)">
    <rect width="68" height="68" rx="16" fill="#ff6ac1" fill-opacity="0.1" stroke="#ff6ac1" stroke-width="1.2"/>
    <rect width="68" height="68" rx="16" fill="none" stroke="#ff6ac1" stroke-width="1.5" opacity="0.3" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    
    <path d="M 26 22 L 48 34 L 26 46 Z" fill="#ff6ac1">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </path>
    <circle cx="50" cy="20" r="3" fill="#ff6ac1" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title with Electric Typography -->
  <text x="26" y="88" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="0.5">Watcher</text>

  <!-- Description -->
  <text x="26" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">
    <tspan x="26" dy="0">Personal movie &amp; TV series tracker with cloud backup.</tspan>
    <tspan x="26" dy="20">Track season progression, watchlist, and ratings with ease.</tspan>
  </text>

  <!-- Badges -->
  <g transform="translate(26, 178)">
    
    <rect x="0" width="75" height="26" rx="13" fill="#ff6ac1" fill-opacity="0.1" stroke="#ff6ac1" stroke-opacity="0.3"/>
    <text x="37" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Flutter</text>
    <rect x="83" width="55" height="26" rx="13" fill="#ff6ac1" fill-opacity="0.1" stroke="#ff6ac1" stroke-opacity="0.3"/>
    <text x="110" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Dart</text>
    <rect x="146" width="85" height="26" rx="13" fill="#ff6ac1" fill-opacity="0.1" stroke="#ff6ac1" stroke-opacity="0.3"/>
    <text x="188" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">REST API</text>
    <rect x="239" width="105" height="26" rx="13" fill="#ff6ac1" fill-opacity="0.1" stroke="#ff6ac1" stroke-opacity="0.3"/>
    <text x="291" y="17" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">Offline-First</text>
  </g>

  <!-- Bottom Divider & Action with Animated Arrow -->
  <line x1="26" y1="226" x2="494" y2="226" stroke="#1e293b" stroke-width="1"/>
  <text x="26" y="248" fill="#64748b" font-family="'SF Mono', Consolas, monospace" font-size="11">github.com/likhsout/watcher</text>
  
  <g transform="translate(415, 248)">
    <text x="0" y="0" fill="#ff6ac1" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600">VIEW REPO</text>
    <text x="72" y="0" fill="#ff6ac1" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="700">
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="1.8s" repeatCount="indefinite"/>
      →
    </text>
  </g>
</svg>