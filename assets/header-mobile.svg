    <text x="270" y="20" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">likhon@automation-box</text>

    <g font-family="'SF Mono', Consolas, monospace" font-size="12">
      <text x="20" y="60" fill="#3ddc84">$</text>
