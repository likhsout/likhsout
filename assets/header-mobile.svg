<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 510" width="600" height="510">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg_m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Neon Gradients -->
    <linearGradient id="neonPurple_m" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="neonCore_m" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>

    <linearGradient id="sweepGleam_m" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;150%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;250%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowWide_m" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft_m" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="1" y="1" width="598" height="508" rx="16" fill="url(#bg_m)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Ambient Glow Aura Box -->
  <rect x="25" y="25" width="550" height="135" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
  <rect x="25" y="25" width="550" height="135" rx="14" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.35" filter="url(#glowSoft_m)">
    <animate attributeName="opacity" values="0.2;0.5;0.25;0.6;0.2" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Hero Header: Badges and Animated Neon LIKHON -->
  <g transform="translate(45, 45)">
    <!-- Badges -->
    <g>
      <rect width="86" height="22" rx="11" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1"/>
      <text x="43" y="15" fill="#c084fc" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">
        &#x2039; ACTIVE
      </text>

      <g transform="translate(96, 0)">
        <rect width="112" height="22" rx="11" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
        <circle cx="14" cy="11" r="3" fill="#10b981" filter="url(#glowSoft_m)">
          <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="62" y="15" fill="#34d399" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600" text-anchor="middle">
          BANGLADESH
        </text>
      </g>
    </g>

    <!-- Animated Neon Sign LIKHON (Mobile) -->
    <g transform="translate(0, 68)">
      <!-- Wide Aura -->
      <text x="0" y="0" fill="#9333ea" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="3" filter="url(#glowWide_m)">
        <animate attributeName="opacity"
                 values="0.85;0.65;0.95;0.7;0.85;0.95;0.25;0.95;0.88;0.7;0.85"
                 keyTimes="0;0.18;0.35;0.5;0.65;0.75;0.77;0.8;0.88;0.94;1"
                 dur="6s"
                 repeatCount="indefinite"/>
        LIKHON
      </text>
      <!-- Radiant Tube Bloom -->
      <text x="0" y="0" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="3" filter="url(#glowSoft_m)">
        <animate attributeName="opacity"
                 values="0.95;0.8;1;0.85;0.95;1;0.35;1;0.95;0.85;0.95"
                 keyTimes="0;0.18;0.35;0.5;0.65;0.75;0.77;0.8;0.88;0.94;1"
                 dur="6s"
                 repeatCount="indefinite"/>
        LIKHON
      </text>
      <!-- Tube Core -->
      <text x="0" y="0" fill="url(#neonCore_m)" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="3">
        <animate attributeName="opacity"
                 values="1;0.92;1;0.9;1;0.98;0.45;1;0.96;0.92;1"
                 keyTimes="0;0.18;0.35;0.5;0.65;0.75;0.77;0.8;0.88;0.94;1"
                 dur="6s"
                 repeatCount="indefinite"/>
        LIKHON
      </text>
      <!-- Shimmer Gleam -->
      <text x="0" y="0" fill="url(#sweepGleam_m)" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="3">
        LIKHON
      </text>
      <!-- Subtitle -->
      <text x="2" y="26" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="12" font-weight="600">
        @likhsout · Developer &amp; Builder
      </text>
    </g>
  </g>

  <!-- Mobile Animated Terminal Window -->
  <g transform="translate(25, 180)">
    <rect width="550" height="305" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="550" height="34" rx="12" fill="#111827"/>
    <rect y="22" width="550" height="12" fill="#111827"/>
    <circle cx="22" cy="17" r="5" fill="#ef4444"/>
    <circle cx="38" cy="17" r="5" fill="#f59e0b"/>
    <circle cx="54" cy="17" r="5" fill="#10b981"/>
    <text x="275" y="21" fill="#94a3b8" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">bash ~ likhon@automation-box</text>

    <!-- Terminal Lines Stream -->
    <g font-family="'SF Mono', Consolas, monospace" font-size="12">
      <!-- Cmd 1 -->
      <g>
        <clipPath id="clipMCmd1">
          <rect x="20" y="46" width="0" height="24">
            <animate attributeName="width" values="0; 0; 350; 350; 350; 0" keyTimes="0; 0.02; 0.16; 0.92; 0.98; 1" dur="12s" repeatCount="indefinite"/>
          </rect>
        </clipPath>
        <text x="20" y="62" fill="#3ddc84" font-weight="bold">$</text>
        <g clip-path="url(#clipMCmd1)">
          <text x="35" y="62" fill="#f1f5f9">python3 -m diu_scrapper --parse</text>
        </g>
      </g>

      <!-- Logs -->
      <g opacity="0">
        <animate attributeName="opacity" values="0; 0; 1; 1; 1; 0" keyTimes="0; 0.18; 0.19; 0.92; 0.98; 1" dur="12s" repeatCount="indefinite"/>
        <text x="20" y="86" fill="#a78bfa">&gt; Reading workbook: 3 sheets parsed</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0; 0; 1; 1; 1; 0" keyTimes="0; 0.25; 0.26; 0.92; 0.98; 1" dur="12s" repeatCount="indefinite"/>
        <text x="20" y="110" fill="#38bdf8">&gt; 1,420 class periods structured to JSON</text>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" values="0; 0; 1; 1; 1; 0" keyTimes="0; 0.31; 0.32; 0.92; 0.98; 1" dur="12s" repeatCount="indefinite"/>
        <text x="20" y="134" fill="#3ddc84" font-weight="bold">[ OK ]</text>
        <text x="65" y="134" fill="#cbd5e1">Pipeline complete · Zero errors</text>
      </g>

      <!-- Cmd 2 -->
      <g opacity="0">
        <animate attributeName="opacity" values="0; 0; 1; 1; 1; 0" keyTimes="0; 0.35; 0.36; 0.92; 0.98; 1" dur="12s" repeatCount="indefinite"/>
        <clipPath id="clipMCmd2">
          <rect x="20" y="150" width="0" height="24">
            <animate attributeName="width" values="0; 0; 250; 250; 250; 0" keyTimes="0; 0.37; 0.48; 0.92; 0.98; 1" dur="12s" repeatCount="indefinite"/>
          </rect>
        </clipPath>
        <text x="20" y="166" fill="#3ddc84" font-weight="bold">$</text>
        <g clip-path="url(#clipMCmd2)">
          <text x="35" y="166" fill="#f1f5f9">flutter build apk --release</text>
        </g>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0; 0; 1; 1; 1; 0" keyTimes="0; 0.50; 0.51; 0.92; 0.98; 1" dur="12s" repeatCount="indefinite"/>
        <text x="20" y="190" fill="#93c5fd">&gt; Compiling Watcher &amp; CashBook</text>
        <text x="20" y="214" fill="#3ddc84" font-weight="bold">[ OK ]</text>
        <text x="65" y="214" fill="#34d399">Build complete · Offline-first</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" values="0; 0; 1; 1; 1; 0" keyTimes="0; 0.60; 0.61; 0.92; 0.98; 1" dur="12s" repeatCount="indefinite"/>
        <text x="20" y="248" fill="#a78bfa">likhon@dev</text>
        <text x="100" y="248" fill="#3ddc84" font-weight="bold">$</text>
        <text x="115" y="248" fill="#f1f5f9">git push origin main</text>
        <rect x="265" y="236" width="7" height="15" fill="#3ddc84">
          <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>