    <rect width="105" height="24" rx="12" fill="#3ddc84" fill-opacity="0.12" stroke="#3ddc84" stroke-width="1"/>
    <text x="52" y="16" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">🇧🇩 BANGLADESH</text>

    <text x="0" y="70" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="3" filter="url(#glowP)">LIKHON</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="3">LIKHON</text>
    <text x="0" y="98" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="13" font-weight="600">@Likhon545466 · Developer &amp; Automation Builder</text>
  </g>

  <!-- Mobile Terminal snippet -->
