      <text x="20" y="206" fill="#3ddc84">[ OK ]</text>
      <text x="65" y="206" fill="#3ddc84">Build complete · Offline-first</text>

      <text x="20" y="238" fill="#a78bfa">likhon@dev</text>
      <text x="100" y="238" fill="#3ddc84">$</text>
      <text x="115" y="238" fill="#f0f6fc">git push origin main</text>
      <rect x="260" y="227" width="7" height="14" fill="#3ddc84">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
