<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
  <defs>
    <linearGradient id="bg_m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <filter id="glowG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="598" height="478" rx="16" fill="url(#bg_m)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Neon Header -->
  <g transform="translate(30, 45)">
    <rect width="100" height="24" rx="12" fill="#3ddc84" fill-opacity="0.12" stroke="#3ddc84" stroke-width="1"/>
    <text x="50" y="16" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">🇧🇩 BANGLADESH</text>

    <text x="0" y="70" fill="#3ddc84" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="3" filter="url(#glowG)">LIKHON</text>
    <text x="0" y="70" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="3">LIKHON</text>
    <text x="0" y="98" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="13" font-weight="600">@Likhon545466 · Android &amp; Flutter Dev</text>
  </g>

  <!-- Mobile Terminal snippet -->
  <g transform="translate(30, 170)">
    <rect width="540" height="275" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
    <rect width="540" height="32" rx="12" fill="#161b22"/>
    <rect y="20" width="540" height="12" fill="#161b22"/>
    <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
    <circle cx="36" cy="16" r="5" fill="#ffbd2e"/>
    <circle cx="52" cy="16" r="5" fill="#27c93f"/>
    <text x="270" y="20" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="11" text-anchor="middle">likhon@terminal</text>

    <g font-family="'SF Mono', Consolas, monospace" font-size="12">
      <text x="20" y="60" fill="#3ddc84">$</text>
      <text x="35" y="60" fill="#f0f6fc">fastboot flash system likhon.img</text>
      <text x="20" y="82" fill="#79c0ff">Sending 'system'... OKAY [ 0.04s ]</text>
      <text x="20" y="102" fill="#79c0ff">Writing 'system'... OKAY [ 0.12s ]</text>
      <text x="20" y="130" fill="#3ddc84">$</text>
      <text x="35" y="130" fill="#f0f6fc">fastboot reboot</text>
      <text x="20" y="152" fill="#a5d6ff">&gt; Rebooting to system...</text>
      <text x="20" y="180" fill="#3ddc84">[ OK ]</text>
      <text x="65" y="180" fill="#c9d1d9">Initialized Compose &amp; Flutter</text>
      <text x="20" y="202" fill="#3ddc84">[ OK ]</text>
      <text x="65" y="202" fill="#38bdf8">likhon-os v2.6 booted successfully.</text>
      <text x="20" y="235" fill="#ff7b72">likhon@android</text>
      <text x="135" y="235" fill="#3ddc84">$</text>
      <rect x="145" y="224" width="7" height="14" fill="#3ddc84">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>