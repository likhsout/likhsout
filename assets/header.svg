<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card Frame -->
  <rect x="1" y="1" width="998" height="398" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Left: Terminal Session -->
  <g transform="translate(25, 25)">
    <rect width="520" height="350" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1.5"/>
    <!-- Terminal Header Bar -->
    <rect width="520" height="36" rx="12" fill="#161b22"/>
    <rect y="24" width="520" height="12" fill="#161b22"/>
    <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="18" r="6" fill="#27c93f"/>
    <text x="260" y="22" fill="#8b949e" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="12" text-anchor="middle">bash ~ likhon@automation-box</text>

    <!-- Terminal Lines -->
    <g font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="12.5">
      <!-- Command 1 -->
      <text x="24" y="66" fill="#3ddc84">$</text>
      <text x="40" y="66" fill="#f0f6fc">python3 -m diu_scrapper --parse routine.xlsx</text>
      
      <!-- Output 1 -->
      <text x="24" y="90" fill="#a78bfa">&gt; Reading workbook:</text>
      <text x="180" y="90" fill="#c9d1d9">3 sheets [Day, Eve, Ramadan]</text>

      <text x="24" y="112" fill="#79c0ff">&gt; Parsing metadata:</text>
      <text x="180" y="112" fill="#3ddc84">Semester, Dept, Effective Date</text>

      <text x="24" y="134" fill="#79c0ff">&gt; Normalizing time slots:</text>
      <text x="215" y="134" fill="#f0f6fc">1,420 class periods mapped</text>

      <text x="24" y="156" fill="#3ddc84">[ OK ]</text>
      <text x="75" y="156" fill="#c9d1d9">JSON payload generated: routine.json</text>

      <!-- Command 2 -->
      <text x="24" y="188" fill="#3ddc84">$</text>
      <text x="40" y="188" fill="#f0f6fc">flutter build apk --release</text>
      <text x="24" y="210" fill="#a5d6ff">&gt; Compiling Watcher &amp; CashBook runtimes...</text>
      <text x="24" y="232" fill="#3ddc84">[ OK ]</text>
      <text x="75" y="232" fill="#c9d1d9">Built release/app-release.apk (offline-first)</text>

      <!-- Status -->
      <text x="24" y="266" fill="#38bdf8">&gt; Environment:</text>
      <text x="145" y="266" fill="#f0f6fc">Python · Flutter · Kotlin · React</text>

      <text x="24" y="290" fill="#3ddc84">[ READY ]</text>
      <text x="95" y="290" fill="#3ddc84">All pipelines operational · Zero bloat</text>

      <!-- Interactive Prompt -->
      <text x="24" y="324" fill="#a78bfa">likhon@dev</text>
      <text x="110" y="324" fill="#c9d1d9">:</text>
      <text x="118" y="324" fill="#79c0ff">~</text>
      <text x="130" y="324" fill="#3ddc84">$</text>
      <text x="145" y="324" fill="#f0f6fc">git push origin main</text>
      <rect x="305" y="312" width="8" height="15" fill="#3ddc84">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Right: Neon Sign Board -->
  <g transform="translate(570, 35)">
    <rect width="395" height="330" rx="18" fill="#090d14" stroke="#1f2937" stroke-width="1.5"/>
    <rect width="395" height="330" rx="18" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.4" filter="url(#glowPurple)"/>

    <!-- Top Neon Bar -->
    <path d="M 40 18 L 355 18" stroke="url(#neonPurple)" stroke-width="2.5" stroke-linecap="round" filter="url(#glowPurple)"/>

    <!-- Status Chips -->
    <g transform="translate(35, 45)">
      <rect width="90" height="24" rx="12" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-width="1"/>
      <text x="45" y="16" fill="#c4b5fd" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">⚡ ACTIVE</text>
    </g>

    <g transform="translate(135, 45)">
      <rect width="110" height="24" rx="12" fill="#3ddc84" fill-opacity="0.12" stroke="#3ddc84" stroke-width="1"/>
      <text x="55" y="16" fill="#3ddc84" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle">🇧🇩 BANGLADESH</text>
    </g>

    <!-- Neon Sign: LIKHON -->
    <g transform="translate(35, 140)">
      <text x="0" y="0" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="4" filter="url(#glowPurple)" opacity="0.85">LIKHON</text>
      <text x="0" y="0" fill="#f5f3ff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="4">LIKHON</text>
      <text x="2" y="32" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="13" font-weight="600" letter-spacing="1">@Likhon545466 · Developer &amp; Builder</text>
    </g>

    <!-- Accent Divider -->
    <line x1="35" y1="195" x2="360" y2="195" stroke="#30363d" stroke-width="1"/>
    <line x1="35" y1="195" x2="160" y2="195" stroke="#38bdf8" stroke-width="2" filter="url(#glowCyan)"/>

    <!-- Matrix -->
    <g transform="translate(35, 230)" font-family="'SF Mono', Consolas, monospace" font-size="12">
      <text x="0" y="0" fill="#8b949e">&gt; flagship:</text>
      <text x="90" y="0" fill="#a78bfa">DIU Campus Schedule Parser</text>

      <text x="0" y="24" fill="#8b949e">&gt; toolkit:</text>
      <text x="90" y="24" fill="#38bdf8">python · flutter · compose · ts</text>

      <text x="0" y="48" fill="#8b949e">&gt; focus:</text>
      <text x="90" y="48" fill="#3ddc84">offline-first · automations</text>

      <text x="0" y="72" fill="#8b949e">&gt; motto:</text>
      <text x="90" y="72" fill="#f0f6fc">solve real friction with code ✨</text>
    </g>
  </g>
</svg>