    <text x="16" y="52" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="11">Watcher · CashBook</text>
    <text x="16" y="70" fill="#38bdf8" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="600">● Flutter · Offline-First</text>
