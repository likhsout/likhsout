    <text x="45" y="28" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Campus Automation</text>
    <text x="16" y="52" fill="#8b949e" font-family="'SF Mono', Consolas, monospace" font-size="11">DIU Routine Scrapper</text>
