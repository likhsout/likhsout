<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="bg_tm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <filter id="glow_tm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="318" height="198" rx="14" fill="url(#bg_tm)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="318" height="198" rx="14" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.2" filter="url(#glow_tm)">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Tag with Live Dot -->
  <g transform="translate(18, 16)">
    <rect width="145" height="20" rx="10" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.4"/>
    <circle cx="10" cy="10" r="2.5" fill="#f43f5e" filter="url(#glow_tm)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="77" y="14" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="600" text-anchor="middle">⚡ SYSTEM &amp; TWEAKS</text>
  </g>

  <!-- Title -->
  <text x="18" y="62" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Android Modding Lab</text>

  <!-- Description -->
  <text x="18" y="86" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">
    <tspan x="18" dy="0">Custom ReVanced patches, bytecode modi...</tspan>
  </text>

  <!-- Mini Badges -->
  <g transform="translate(18, 116)">
    <rect x="0" width="60" height="20" rx="10" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-opacity="0.3"/>
    <text x="30" y="14" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="9.5" text-anchor="middle">Smali</text>
    <rect x="68" width="50" height="20" rx="10" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-opacity="0.3"/>
    <text x="93" y="14" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="9.5" text-anchor="middle">Java</text>
  </g>

  <!-- Action with animated arrow -->
  <line x1="18" y1="152" x2="302" y2="152" stroke="#1e293b" stroke-width="1"/>
  <g transform="translate(18, 176)">
    <text x="0" y="0" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600">VIEW REPO</text>
    <text x="68" y="0" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700">
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="1.8s" repeatCount="indefinite"/>
      →
    </text>
  </g>
</svg>