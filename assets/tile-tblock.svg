<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="bg_ttb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <filter id="glow_ttb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="318" height="198" rx="14" fill="url(#bg_ttb)" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="1" y="1" width="318" height="198" rx="14" fill="none" stroke="#f43f5e" stroke-width="1.5" opacity="0.2" filter="url(#glow_ttb)">
    <animate attributeName="opacity" values="0.15;0.5;0.15" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Tag with Live Dot -->
  <g transform="translate(18, 16)">
    <rect width="170" height="20" rx="10" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.4"/>
    <circle cx="10" cy="10" r="2.5" fill="#f43f5e" filter="url(#glow_ttb)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="94" y="14" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="9.5" font-weight="600" text-anchor="middle">🛡️ AD BLOCKER &amp; PRIVACY</text>
  </g>

  <!-- Top Right Animated Badge -->
  <g transform="translate(258, 14)">
    <rect width="44" height="44" rx="12" fill="#161b22" stroke="#f43f5e" stroke-width="1.2" stroke-opacity="0.4"/>
    <rect width="44" height="44" rx="12" fill="none" stroke="#f43f5e" stroke-width="1.2" opacity="0.3" filter="url(#glow_ttb)">
      <animate attributeName="opacity" values="0.2;0.65;0.2" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <path d="M 22 12 L 32 16 C 32 26 26 32 22 35 C 18 32 12 26 12 16 Z" fill="none" stroke="#f43f5e" stroke-width="1.6"/>
    <circle cx="22" cy="23" r="5.2" fill="none" stroke="#f43f5e" stroke-width="1.3"/>
    <line x1="18.5" y1="19.5" x2="25.5" y2="26.5" stroke="#f43f5e" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="32" cy="14" r="2" fill="#f43f5e" filter="url(#glow_ttb)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="18" y="62" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">T-Block Origin</text>

  <!-- Description -->
  <text x="18" y="86" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">
    <tspan x="18" dy="0">Fast, privacy-first Manifest V3 content block...</tspan>
  </text>

  <!-- Mini Badges -->
  <g transform="translate(18, 116)">
    <rect x="0" width="85" height="20" rx="10" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-opacity="0.3"/>
    <text x="42" y="14" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="9.5" text-anchor="middle">Manifest V3</text>
    <rect x="93" width="75" height="20" rx="10" fill="#f43f5e" fill-opacity="0.1" stroke="#f43f5e" stroke-opacity="0.3"/>
    <text x="130" y="14" fill="#e2e8f0" font-family="'SF Mono', Consolas, monospace" font-size="9.5" text-anchor="middle">Material 3</text>
  </g>

  <!-- Action with animated arrow -->
  <line x1="18" y1="152" x2="302" y2="152" stroke="#1e293b" stroke-width="1"/>
  <g transform="translate(18, 176)">
    <text x="0" y="0" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="10.5" font-weight="600">VIEW REPO</text>
    <text x="68" y="0" fill="#f43f5e" font-family="'SF Mono', Consolas, monospace" font-size="11" font-weight="700">
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="1.8s" repeatCount="indefinite"/>
      →
    </text>
  </g>
</svg>
